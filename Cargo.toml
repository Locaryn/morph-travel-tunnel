[package]
name = "locaryn-plugin-remote"
version = "2.1.0"
edition = "2021"
description = "Official Locaryn Extension: Remote access & outbound tunnels (Cloudflare, ngrok, devtunnel) with QR pairing"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-remote-mcp"
path = "src/bin/remote_mcp.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
